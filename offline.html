<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Duka — Offline</title>
<meta name="theme-color" content="#0f766e">
<style>
*{margin:0;padding:0;box-sizing:border-box} body{font-family:system-ui,-apple-system,Segoe UI,Roboto; background:#f8fafc; color:#0f172a; display:grid; place-items:center; min-height:100dvh; padding:20px}
.card{background:white; border-radius:20px; box-shadow:0 10px 30px rgba(15,23,42,0.08); padding:28px; max-width:420px; width:100%; text-align:center; border:1px solid #e2e8f0}
.icon{width:64px;height:64px; border-radius:16px; background:#0f766e; color:white; display:grid; place-items:center; font-size:28px; margin:0 auto 16px}
h1{font-size:18px; font-weight:800; letter-spacing:-0.3px} p{color:#64748b; font-size:13px; margin-top:8px; line-height:1.6}
.btn{margin-top:18px; width:100%; padding:14px; border-radius:14px; border:none; background:#0f766e; color:white; font-weight:800; font-size:14px; cursor:pointer}
small{display:block; margin-top:12px; color:#94a3b8; font-size:11px}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📦</div>
    <h1>You’re offline</h1>
    <p>Duka works offline — your sales, purchases & stock are safe on this device. Reconnect to sync, or continue working. Your data never leaves your phone.</p>
    <button class="btn" onclick="location.href='/'">Back to Duka</button>
    <small>Tip: Add to Home Screen for full offline app</small>
  </div>
</body>
</html>
