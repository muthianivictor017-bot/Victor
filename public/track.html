<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track an order — Victor Atelier</title>
<link rel="icon" href="/assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="logo" href="/"><img src="/assets/logo.png" alt="V"><b>Victor Atelier</b></a>
    <button class="menu" onclick="toggleNav()" aria-label="Menu"><i class="fas fa-bars"></i></button>
    <nav class="nav" id="nav">
      <a href="/">House</a>
      <a href="/services.html">Services</a>
      <a href="/lookbook.html">Lookbook</a>
      <a href="/about.html">The workroom</a>
      <a href="/track.html">Track</a>
      <a href="/book.html" class="btn btn-gold">Book a fitting</a>
      <a href="/desk.html">Staff</a>
    </nav>
  </div>
</header>
<main class="wrap page-hero">
  <div class="grid-2">
    <div>
      <div class="eyebrow">The rail</div>
      <h1>Follow your ticket.</h1>
      <p class="lede">Use the number from your booking and the phone you gave the house.</p>
      <p class="lede">Demo: ticket <b>VA-1042</b>, phone <b>+1 646 555 2211</b></p>
    </div>
    <form class="card pad" onsubmit="submitTrack(event)">
      <div class="field"><label>Ticket number</label><input id="trTicket" placeholder="VA-1042" required></div>
      <div class="field"><label>Phone</label><input id="trPhone" placeholder="Same number used to book" required></div>
      <button class="btn btn-gold" type="submit">Look up</button>
      <div id="trackBox"></div>
    </form>
  </div>
</main>
<footer class="site-foot">
  <div class="wrap"><div><strong>Victor Atelier</strong></div><div><a href="/book.html">Book a fitting</a></div></div>
</footer>
<script src="/js/site.js"></script>
</body>
</html>
