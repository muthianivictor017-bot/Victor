<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a fitting — Victor Atelier</title>
<link rel="icon" href="/assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="logo" href="/"><img src="/assets/logo.png" alt="V"><b>Victor Atelier</b></a>
    <button class="menu" onclick="toggleNav()" aria-label="Menu"><i class="fas fa-bars"></i></button>
    <nav class="nav" id="nav">
      <a href="/">House</a>
      <a href="/services.html">Services</a>
      <a href="/lookbook.html">Lookbook</a>
      <a href="/about.html">The workroom</a>
      <a href="/track.html">Track</a>
      <a href="/book.html" class="btn btn-gold">Book a fitting</a>
      <a href="/desk.html">Staff</a>
    </nav>
  </div>
</header>
<main class="wrap page-hero">
  <div class="grid-2">
    <div>
      <div class="eyebrow">Appointments</div>
      <h1>Request a consultation.</h1>
      <p class="lede">Reception confirms within a working day. You will receive a ticket to track the order.</p>
      <img src="/assets/hands-work.jpg" alt="Hands at work" style="width:100%;height:280px;object-fit:cover;margin-top:12px">
    </div>
    <form class="card pad" onsubmit="submitBook(event)">
      <div id="bookMsg" class="notice"></div>
      <div class="form-grid">
        <div class="field"><label>Full name</label><input id="bkName" required></div>
        <div class="field"><label>Phone</label><input id="bkPhone" required placeholder="+254 712 000 000"></div>
        <div class="field"><label>Email</label><input id="bkEmail" type="email"></div>
        <div class="field"><label>Service</label><select id="bkService" required></select></div>
        <div class="field"><label>Preferred date</label><input id="bkDate" type="date" required></div>
        <div class="field"><label>Preferred time</label><input id="bkTime" type="time" value="11:00" required></div>
        <div class="field full"><label>Notes</label><textarea id="bkNotes" placeholder="Occasion, cloth, existing garments…"></textarea></div>
      </div>
      <button class="btn btn-gold" type="submit">Send request</button>
    </form>
  </div>
</main>
<footer class="site-foot">
  <div class="wrap">
    <div><strong>Victor Atelier</strong></div>
    <div>Already have a ticket? <a href="/track.html">Track it</a></div>
  </div>
</footer>
<script src="/js/site.js"></script>
</body>
</html>
